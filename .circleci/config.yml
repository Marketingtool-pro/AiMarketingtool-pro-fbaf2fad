version: 2.1

# SonarCloud removed (its org never existed → every scan returned 404).
# Quality/security is covered by CodeQL + Socket + CodeRabbit (GitHub checks)
# and Sonatype (dependency security). This pipeline runs the project's real
# lint using its actual Node toolchain.
jobs:
  lint:
    docker:
      - image: cimg/node:24.3
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Lint (expo)
          command: npm run lint

workflows:
  main:
    jobs:
      - lint
