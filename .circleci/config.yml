# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Orbs are reusable packages of CircleCI configuration that you may share across projects, enabling you to create encapsulated, parameterized commands, jobs, and executors that can be used across multiple projects.
# See: https://circleci.com/docs/orbs/use/orb-intro/
jobs:
  build:
    docker:
      - image: cimg/node:24.16.0

    steps:
      - checkout
      - run:
          name: Node version
          command: node -v
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Lint
          command: npm run lint --if-present
      - run:
          name: Test
          command: npm test --if-present
# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  ci: # This is the name of the workflow; feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - build
version: 2.1

jobs:
  sonarqube:
    docker:
      - image: cimg/android:2024.01.1-node
    resource_class: marketingtool/pro
    steps:
      - checkout
      - run:
          name: Download SonarScanner
          command: |
            wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
            unzip sonar-scanner-cli-5.0.1.3006-linux.zip
      - run:
          name: Run SonarScanner
          command: |
            ./sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner \
              -Dsonar.projectKey=AiMarketingtool-pro-fbaf2fad \
              -Dsonar.organization=marketingtool-pro \
              -Dsonar.sources=src \
              -Dsonar.host.url=${SONAR_HOST_URL} \
              -Dsonar.login=${SONAR_TOKEN}

workflows:
  main:
    jobs:
      - sonarqube
