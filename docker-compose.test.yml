version: '3.8'

services:
  # Testing environment
  appwrite-test:
    image: appwrite/appwrite:latest
    container_name: marketingtool-test-api
    environment:
      - _APP_ENV=test
      - _APP_OPENSSL_KEY_V1=test_key_change_me
      - _APP_DOMAIN=localhost:8081
      - _APP_REDIS_HOST=redis-test
      - _APP_DB_HOST=mariadb-test
      - _APP_DB_PORT=3306
      - _APP_DB_USER=appwrite
      - _APP_DB_PASS=test_password
      - _APP_DB_SCHEMA=appwrite_test
    ports:
      - "8081:80"
    depends_on:
      - mariadb-test
      - redis-test
    networks:
      - marketingtool-test

  mariadb-test:
    image: mariadb:11
    container_name: marketingtool-test-db
    environment:
      - MYSQL_ROOT_PASSWORD=test_root
      - MYSQL_DATABASE=appwrite_test
      - MYSQL_USER=appwrite
      - MYSQL_PASSWORD=test_password
    volumes:
      - mariadb_test_data:/var/lib/mysql
    networks:
      - marketingtool-test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: marketingtool-test-cache
    volumes:
      - redis_test_data:/data
    networks:
      - marketingtool-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mariadb_test_data:
  redis_test_data:

networks:
  marketingtool-test:
    driver: bridge
