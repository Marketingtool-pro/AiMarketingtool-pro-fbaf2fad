# Firebase App Hosting run configuration for the phone repo.
#
# This repository is an Expo (React Native) app. App Hosting builds it with the
# default Node buildpack (which runs `npm run build`, i.e.
# `expo export --platform web` -> ./dist) and then starts it with `npm start`.
#
# `npm start` therefore has to be a REAL web server: Cloud Run requires the
# container to listen on 0.0.0.0:$PORT (8080). It used to be `expo start`, the
# Metro development server on port 8081, so every rollout failed with
# "the user-provided container failed to start and listen on the port defined
# provided by the PORT=8080 environment variable". `npm start` is now
# `node server.js`; the Expo dev server moved to `npm run dev`.

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 5
