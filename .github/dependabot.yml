version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # gradle disabled — no Gradle manifest at "/" (Expo-managed app; android/ is
  # generated by prebuild and not committed). Dependabot errored looking for a
  # root build.gradle. Re-enable with the correct `directory:` if android/ is
  # ever committed.
  # - package-ecosystem: "gradle"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #   open-pull-requests-limit: 5

  # github-actions pinned to commit SHAs manually — Dependabot disabled to prevent spam
  # - package-ecosystem: "github-actions"
