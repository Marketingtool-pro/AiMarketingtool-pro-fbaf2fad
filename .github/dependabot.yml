version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-native"
        versions:
          - ">=0.86.0"
      # react-native-reanimated and react-native-worklets ship coupled C++ and
      # must be upgraded together, as a pair the Expo SDK pins. A minor bump of
      # worklets alone (0.11.4 -> 0.12.1, PR from 2026-08-22) left it outside
      # reanimated's `react-native-worklets` peer range and broke every native
      # build with "no member named 'executeSync' in 'worklets::WorkletRuntime'".
      # Let the Expo SDK upgrade move these, not a weekly minor bump.
      - dependency-name: "react-native-worklets"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react-native-reanimated"
        update-types:
          - "version-update:semver-minor"
      # Same coupling between react-native-iap and its nitro-modules native
      # bridge. Bumping nitro-modules to 0.37.0 on its own (PR #454) put it
      # outside the "^0.36.1" peer range iap declares, which the native peer
      # check caught on Master.
      - dependency-name: "react-native-nitro-modules"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react-native-iap"
        update-types:
          - "version-update:semver-minor"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(functions)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
