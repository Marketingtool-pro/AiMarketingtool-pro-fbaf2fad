version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-native"
        versions:
          - ">=0.86.0"
      # react-native-reanimated and react-native-worklets ship coupled C++ and
      # must be upgraded together, as a pair the Expo SDK pins. A minor bump of
      # worklets alone (0.11.4 -> 0.12.1, PR from 2026-08-22) left it outside
      # reanimated's `react-native-worklets` peer range and broke every native
      # build with "no member named 'executeSync' in 'worklets::WorkletRuntime'".
      # Let the Expo SDK upgrade move these, not a weekly bump. Patch is ignored
      # too: Dependabot walked them to 4.5.3 / 0.10.4 within two days of the pin,
      # which `expo-doctor` then reports as out of date against the SDK's 4.5.1 /
      # 0.10.1. The peer range still held, but the drift is noise that hides the
      # next real break.
      - dependency-name: "react-native-worklets"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-reanimated"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # Same coupling between react-native-iap and its nitro-modules native
      # bridge. Bumping nitro-modules to 0.37.0 on its own (PR #454) put it
      # outside the "^0.36.1" peer range iap declares, which the native peer
      # check caught on Master.
      - dependency-name: "react-native-nitro-modules"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react-native-iap"
        update-types:
          - "version-update:semver-minor"
      # lottie-react-native and react-dom are pinned to the versions Expo SDK 57
      # expects. PR #460 bumped both straight back off those pins the same day
      # they were set (7.3.8 -> 7.4.0, 19.2.3 -> 19.2.8), reintroducing the
      # expo-doctor failure. react-dom must also stay in lockstep with react,
      # which is pinned at 19.2.3. Let the SDK upgrade move them.
      - dependency-name: "lottie-react-native"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(functions)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
