name: Relock

on:
  push:
    branches:
      - 'relock/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Regenerate lockfiles
        run: |
          for d in . functions AiMarketingtool-pro-fbaf2fa plugin-rn-mcp/server; do
            echo "::group::relock $d"
            (cd "$d" && npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*package-lock.json"
          git commit -m "chore(deps): regenerate lockfiles [skip ci]" || echo "nothing to commit"
          git push
