name: Relock

on:
  push:
    branches:
      - 'relock/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Regenerate lockfiles
        run: |
          for d in . functions plugin-rn-mcp/server AiMarketingtool-pro-fbaf2fa; do
            echo "::group::relock $d"
            (cd "$d" && npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Push lockfiles to a new branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="lockfix/${GITHUB_SHA::7}"
          git checkout -b "$BR"
          git add "*package-lock.json"
          if git diff --cached --quiet; then
            echo "lockfiles already up to date"
            exit 0
          fi
          git commit -m "chore(deps): regenerate lockfiles [skip ci]"
          git push origin "$BR"
          echo "pushed $BR" >> $GITHUB_STEP_SUMMARY
