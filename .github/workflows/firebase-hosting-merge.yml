name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - Master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # This repo uses bun (bun.lock) and has no package-lock.json, so `npm ci`
      # failed in ~10s on every push and the web app never deployed. Use a plain
      # install (matches production-deploy.yml) so the build + hosting deploy run.
      - run: npm install --legacy-peer-deps --no-audit --no-fund && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARKETING_TOOL_484720 }}
          channelId: live
          projectId: marketing-tool-484720
