name: TestFlight Upload (no rebuild)

# Uploads an ALREADY-FINISHED EAS iOS build to App Store Connect / TestFlight
# without rebuilding. Use when an `eas build` completed outside the
# production-deploy workflow (so its upload step never ran) — pass the EAS
# build ID from `eas build:list`, or leave empty to submit the latest
# finished iOS build. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS build ID to upload (empty = latest finished iOS build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  upload:
    name: Upload to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385  # v9
        with:
          eas-version: 18.13.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # eas.json's ascApiKeyPath expects the .p8 at the repo root; it only
      # exists as the ASC_API_KEY_BASE64 secret (never committed).
      - name: Restore App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          printf '%s' "$ASC_API_KEY_BASE64" | base64 -d > AuthKey_69JDXUCPU3.p8
          test -s AuthKey_69JDXUCPU3.p8 && echo "ASC key restored" || (echo "ASC key empty — set ASC_API_KEY_BASE64 secret" && exit 1)

      - name: Submit existing build to TestFlight
        run: |
          BUILD_ID="${{ inputs.build_id }}"
          if [ -n "$BUILD_ID" ]; then
            echo "Uploading EAS build $BUILD_ID"
            eas submit --platform ios --profile production --non-interactive --id "$BUILD_ID"
          else
            echo "No build ID given — uploading latest finished iOS build"
            eas submit --platform ios --profile production --non-interactive --latest
          fi
