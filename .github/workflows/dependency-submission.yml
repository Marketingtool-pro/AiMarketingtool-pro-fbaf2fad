name: Automatic Dependency Submission

on:
  push:
    branches: [Master]

permissions:
  contents: write

jobs:
  submit-gradle:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v4

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v4
        with:
          distribution: temurin
          java-version: 17  # Gradle 8.1 requires Java ≤ 20; pin 17 (LTS)

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: wrapper
