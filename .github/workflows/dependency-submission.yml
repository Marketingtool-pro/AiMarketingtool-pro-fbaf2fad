name: Dependency Submission (Gradle)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-gradle:
    name: submit-gradle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Submit Gradle dependencies (android-patches)
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          build-root-directory: android-patches
          dependency-graph: generate-and-submit
