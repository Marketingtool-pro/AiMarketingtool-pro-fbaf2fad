name: Java CI with Maven

# Manual-only: the marketing-tool/ Java project is an incomplete scaffold (its
# pom.xml is a copy of Sonatype's central-publishing-maven-plugin POM, and
# AppTest needs JUnit 5 which the POM doesn't declare), so `mvn package` fails.
# Removed push/PR triggers so it stops failing every commit. Re-add them once
# marketing-tool/pom.xml is a real project (correct coordinates + junit-jupiter).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # The Maven project lives in marketing-tool/ (App.java + AppTest); there is
    # no POM at the repo root. Run Maven there, else "no POM in this directory".
    - name: Build with Maven
      working-directory: marketing-tool
      run: mvn -B package
