name: ASC Submit (no rebuild)

# Submits an already-uploaded iOS build to App Store review WITHOUT building.
# Uses scripts/asc_autosubmit.rb, which now creates a fresh editable version
# (VERSION_STRING) when only a live version exists, and submits the build alone
# when all IAPs are already APPROVED. Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      version_string:
        description: "App Store version to create/submit (e.g. 1.5.6)"
        required: false
        default: ""
      build_number:
        description: "Build number already uploaded to App Store Connect"
        required: true
        default: "554"
      whats_new:
        description: "What's New / release notes text (required for live submission)"
        required: true
        default: "Fixes app launch stability on iOS and improves the tool result-to-desktop handoff. Thank you for using MarketingTool!"

permissions:
  contents: read

jobs:
  submit:
    name: Submit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Restore App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          printf '%s' "$ASC_API_KEY_BASE64" | base64 -d > AuthKey_69JDXUCPU3.p8
          test -s AuthKey_69JDXUCPU3.p8 && echo "ASC key restored" || (echo "ASC key empty — set ASC_API_KEY_BASE64 secret" && exit 1)

      - name: Create version + submit build (IAPs already approved)
        env:
          ASC_KEY_PATH: ./AuthKey_69JDXUCPU3.p8
          VERSION_STRING: ${{ inputs.version_string }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          WHATS_NEW: ${{ inputs.whats_new }}
          DRY_RUN: 'false'
        run: |
          sudo gem install jwt --no-document
          export VERSION_STRING="${VERSION_STRING:-$(node -pe "require('./app.json').expo.version")}"
          export ASC_KEY_ID="$(node -pe "require('./eas.json').submit.production.ios.ascApiKeyId")"
          export ASC_ISSUER_ID="$(node -pe "require('./eas.json').submit.production.ios.ascApiKeyIssuerId")"
          export ASC_APP_ID="$(node -pe "require('./eas.json').submit.production.ios.ascAppId")"
          ruby scripts/asc_autosubmit.rb
