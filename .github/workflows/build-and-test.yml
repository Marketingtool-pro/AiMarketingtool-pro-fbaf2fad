name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "copilot/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  eas-build-preview:
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build preview for Android and iOS (wait for result)
        run: |
          # Retry against transient Expo / GH Actions outages so a real
          # PR build failure is the only thing that fails this job.
          # Backoff covers ~8.5 min of unavailability before giving up.
          attempt=1
          max_attempts=5
          sleeps="30 60 120 240"
          log="$(mktemp)"
          while :; do
            if eas build --platform all --profile preview --non-interactive 2>&1 | tee "$log"; then
              break
            fi
            status="${PIPESTATUS[0]}"
            if [ "$attempt" -ge "$max_attempts" ]; then
              # Surface the actual eas error and any build URLs so the
              # annotation summary tells the user where to look.
              echo "::group::Final eas build output (last 100 lines)"
              tail -n 100 "$log"
              echo "::endgroup::"
              if build_url=$(grep -oE 'https://expo\.dev/[^[:space:]]+/builds/[A-Za-z0-9-]+' "$log" | tail -n1); then
                [ -n "$build_url" ] && echo "::notice::Last EAS build URL: ${build_url}"
              fi
              echo "::error::eas build failed after ${attempt} attempts (exit ${status}); see grouped log above"
              exit "$status"
            fi
            sleep_for=$(echo "$sleeps" | cut -d' ' -f"$attempt")
            echo "::warning::eas build attempt ${attempt} failed (exit ${status}); retrying in ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done
