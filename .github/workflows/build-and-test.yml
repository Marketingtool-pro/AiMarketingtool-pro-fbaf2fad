name: Build and Test

on:
  push:
    branches: [Master, main, develop]
  pull_request:
    branches: [Master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      - name: Lint
        # Non-blocking: lint is quality, not a ship gate, and the eslint stack
        # has been churned repeatedly. Report issues without failing the build.
        run: npm run lint --if-present || echo "::warning::lint reported issues (non-blocking)"
      
      - name: Run tests
        run: npm test --if-present

  eas-build-preview:
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385  # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      # iOS held — Android only in CI (iOS is built/submitted manually).
      - name: Build preview for Android & Ios
        run: eas build --platform android --profile preview --non-interactive
