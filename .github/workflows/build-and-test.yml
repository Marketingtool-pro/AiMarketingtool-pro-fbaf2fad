name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "copilot/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  eas-build-preview:
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build preview for Android and iOS (wait for result)
        run: |
          # Retry against transient Expo / GH Actions outages (cache 400,
          # "services aren't available right now") so a real PR build
          # failure is the only thing that fails this job.
          attempt=1
          max_attempts=3
          until eas build --platform all --profile preview --non-interactive; do
            status=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::eas build failed after ${attempt} attempts (exit ${status})"
              exit "$status"
            fi
            sleep_for=$((30 * attempt))
            echo "::warning::eas build attempt ${attempt} failed (exit ${status}); retrying in ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done
