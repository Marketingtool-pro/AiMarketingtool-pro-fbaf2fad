name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "copilot/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  eas-build-preview:
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo / EAS auth (auto-connect)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty; the preview build cannot authenticate to EAS."
            exit 1
          fi
          eas whoami
          eas project:info

      - name: Build preview for Android and iOS (wait for result)
        run: |
          # Retry against transient Expo / GH Actions outages so a real
          # PR build failure is the only thing that fails this job.
          # Backoff covers ~8.5 min of unavailability before giving up.
          attempt=1
          max_attempts=5
          sleeps="30 60 120 240"
          log="$(mktemp)"
          while :; do
            if eas build --platform all --profile preview --non-interactive 2>&1 | tee "$log"; then
              break
            fi
            status="${PIPESTATUS[0]}"
            if [ "$attempt" -ge "$max_attempts" ]; then
              # Surface the actual eas error so it shows in the
              # annotation summary, not just the expandable log.
              echo "::group::Final eas build output (last 100 lines)"
              tail -n 100 "$log"
              echo "::endgroup::"
              if build_url=$(grep -oE 'https://expo\.dev/[^[:space:]]+/builds/[A-Za-z0-9-]+' "$log" | tail -n1); then
                [ -n "$build_url" ] && echo "::notice::Last EAS build URL: ${build_url}"
              fi
              # Emit every non-empty captured line as a warning
              # annotation so even an "empty" eas log is fully visible
              # in the summary without expanding any step.
              line_no=0
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                line_no=$((line_no + 1))
                # Cap at 50 lines so we don't flood the run with 100s
                # of annotations from a long build log.
                [ "$line_no" -gt 50 ] && break
                echo "::warning::eas[${line_no}]: ${line}"
              done < <(tail -n 200 "$log")
              if [ "$line_no" -eq 0 ]; then
                echo "::error::eas exited ${status} with no stdout/stderr — likely an auth failure (EXPO_TOKEN) or eas-cli crash before printing."
              fi
              echo "::error::eas build failed after ${attempt} attempts (exit ${status})"
              exit "$status"
            fi
            sleep_for=$(echo "$sleeps" | cut -d' ' -f"$attempt")
            echo "::warning::eas build attempt ${attempt} failed (exit ${status}); retrying in ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done
