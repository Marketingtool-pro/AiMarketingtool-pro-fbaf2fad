name: Build and Test

on:
  push:
    branches: [Master, main, develop]
  pull_request:
    branches: [Master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      # Blocking: nothing else in CI compiles native code, so a bad native
      # version pair (see the script header) otherwise stays green here and
      # only shows up ~20 minutes into an EAS build.
      - name: Check native dependency compatibility
        run: node .github/scripts/check-native-peers.mjs

      - name: Lint
        # Non-blocking: lint is quality, not a ship gate, and the eslint stack
        # has been churned repeatedly. Report issues without failing the build.
        run: npm run lint --if-present || echo "::warning::lint reported issues (non-blocking)"
      
      - name: Run tests
        run: npm test --if-present

  eas-build-preview:
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385  # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      # iOS held — Android only in CI (iOS is built/submitted manually).
      - name: Build preview for Android & Ios
        run: eas build --platform android --profile preview --non-interactive
