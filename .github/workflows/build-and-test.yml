name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  eas-build-preview:
    runs-on: ubuntu-latest
    needs: test
    # Dependabot PRs run with a read-only token and no access to
    # EXPO_TOKEN, so excluded.
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      )
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install eas-cli directly (bypass expo-github-action probe)
        run: npm install -g eas-cli@18.13.1

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo / EAS auth (auto-connect)
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty; the preview build cannot authenticate to EAS."
            exit 1
          fi
          surface() {
            local label="$1"; shift
            local log; log="$(mktemp)"
            if ! "$@" 2>&1 | tee "$log"; then
              local s="${PIPESTATUS[0]}"
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                echo "::error::${label}: ${line}"
              done < "$log"
              echo "::error::${label} failed (exit ${s})"
              return "$s"
            fi
          }
          surface "eas --version" eas --version
          surface "eas whoami" eas whoami
          surface "eas project:info" eas project:info

      - name: Build preview for Android and iOS (wait for result)
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail

          # Indicators of *transient* failures we should retry. Anything
          # else (compile error, signing failure, config error, etc.) is
          # deterministic and we exit on the first failure to avoid
          # burning EAS build minutes on five identical failures.
          is_transient() {
            grep -qiE 'service unavailable|services aren'\''t available|cache service responded|enotfound|etimedout|econnreset|econnaborted|rate limit|getaddrinfo|socket hang up|502 bad gateway|503 service|504 gateway|network request failed|fetch failed' "$1"
          }

          attempt=1
          max_attempts=5
          sleeps="30 60 120 240"
          log="$(mktemp)"
          while :; do
            if eas build --platform all --profile preview --non-interactive 2>&1 | tee "$log"; then
              break
            fi
            status="${PIPESTATUS[0]}"
            if [ "$attempt" -ge "$max_attempts" ] || ! is_transient "$log"; then
              echo "::group::Final eas build output (last 100 lines)"
              tail -n 100 "$log"
              echo "::endgroup::"
              if build_url=$(grep -oE 'https://expo\.dev/[^[:space:]]+/builds/[A-Za-z0-9-]+' "$log" | tail -n1); then
                [ -n "$build_url" ] && echo "::notice::Last EAS build URL: ${build_url}"
              fi
              line_no=0
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                line_no=$((line_no + 1))
                [ "$line_no" -gt 50 ] && break
                echo "::warning::eas[${line_no}]: ${line}"
              done < <(tail -n 200 "$log")
              if [ "$line_no" -eq 0 ]; then
                echo "::error::eas exited ${status} with no stdout/stderr — likely an auth failure (EXPO_TOKEN) or eas-cli crash before printing."
              fi
              if ! is_transient "$log"; then
                echo "::error::eas build failed (exit ${status}) with a deterministic error; not retrying"
              else
                echo "::error::eas build failed after ${attempt} attempts (exit ${status})"
              fi
              exit "$status"
            fi
            sleep_for=$(echo "$sleeps" | cut -d' ' -f"$attempt")
            echo "::warning::eas build attempt ${attempt} hit a transient failure (exit ${status}); retrying in ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done
