name: Build and Test

on:
  push:
    branches: [Master, main, develop]
  pull_request:
    branches: [Master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR. A new push cancels the run its push superseded
# instead of queueing another alongside it. Without this, every push to a PR
# stacked a further Build and Test run: 12 were sitting queued at once, which
# is what exhausted the hosted-runner job concurrency limit for the whole org
# (GitHub: "All GitHub-hosted runners with label [ubuntu-latest] are busy").
#
# Deploy workflows deliberately keep cancel-in-progress: false -- a release
# must never be killed half way through. This applies to PR CI only, where
# only the newest commit's result is of any use.
concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


jobs:
  test:
    # Was ubuntu-latest and sat queued for hours. The org saturates the
    # GitHub-hosted job concurrency limit -- GitHub's own message is "All
    # GitHub-hosted runners with label [ubuntu-latest] are busy" -- and
    # self-hosted runners are exempt from that limit. The sibling
    # eas-build-preview job in this same workflow already ran self-hosted,
    # so this job was the odd one out.
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      # Blocking: nothing else in CI compiles native code, so a bad native
      # version pair (see the script header) otherwise stays green here and
      # only shows up ~20 minutes into an EAS build.
      - name: Check native dependency compatibility
        run: node .github/scripts/check-native-peers.mjs

      - name: Lint
        # Non-blocking: lint is quality, not a ship gate, and the eslint stack
        # has been churned repeatedly. Report issues without failing the build.
        run: npm run lint --if-present || echo "::warning::lint reported issues (non-blocking)"
      
      - name: Run tests
        run: npm test --if-present

  eas-build-preview:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385  # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      # iOS held — Android only in CI (iOS is built/submitted manually).
      - name: Build preview for Android & Ios
        run: eas build --platform android --profile preview --non-interactive
