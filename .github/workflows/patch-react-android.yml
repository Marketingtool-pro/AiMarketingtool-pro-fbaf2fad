name: Patch react-android AAR

on:
  push:
    branches:
      - Master
      - main
    paths:
      - android-patches/**
  workflow_dispatch:

jobs:
  build-patched-aar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '21.0.5'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x android-patches/gradlew

      - name: Build and Publish Patched AAR
        working-directory: android-patches
        env:
          GITHUB_ACTOR: JpTWsE
          GITHUB_TOKEN: MhYPFAX3cg8XrWbD6LUmx8P16F74fAoPa
        run: ./gradlew assemblePatchedAAR publish --no-daemon --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: react-android-patched
          path: android-patches/build/patched/react-android-*.aar
