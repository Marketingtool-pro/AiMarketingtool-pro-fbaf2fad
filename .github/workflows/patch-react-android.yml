name: Patch react-android AAR

on:
  push:
    branches:
      - main
    paths:
      - android-patches/**
  workflow_dispatch:

jobs:
  build-patched-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x android-patches/gradlew

      - name: Build and publish patched AAR
        working-directory: android-patches
        run: ./gradlew assemblePatchedAAR publish --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - uses: actions/upload-artifact@v4
        with:
          name: react-android-patched
          path: android-patches/build/patched/react-android-0.83.6-e2e.1.aar
