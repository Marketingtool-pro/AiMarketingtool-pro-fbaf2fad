name: Patch react-android AAR

on:
  push:
    branches:
      - Master
      - main
    paths:
      - android-patches/**
  workflow_dispatch:

env:
  # Single source of truth for the patch revision. MUST stay in sync with
  # PATCHED_VERSION in plugins/withRNEdgeToEdgeFix.js (consumed at prebuild)
  # and the default patchRevision in android-patches/build.gradle.
  PATCH_REVISION: '1'
  # Must track the react-native version in package.json. It sat at 0.85.3 after
  # react-native moved to 0.86.2, so the AAR this workflow publishes no longer
  # matched the installed runtime — and withRNEdgeToEdgeFix substitutes it for
  # EVERY com.facebook.react:react-android request, which broke every Android
  # build on a JSI mismatch. The plugin now refuses to substitute a mismatched
  # AAR, so publishing 0.86.2-e2e.1 from here is what re-enables the fix.
  REACT_VERSION: '0.86.3'

jobs:
  build-patched-aar:
    # Was `self-hosted`, but this org has no self-hosted runners registered
    # (org and repo runner lists are both empty), so the job could never be
    # picked up — it queued forever. Use a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/update the react-android-* release
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          java-version: '21.0.5'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x android-patches/gradlew

      # Both GitHub Packages and Releases are immutable on this repo: version
      # ${REACT_VERSION}-e2e.${PATCH_REVISION} can only ever be published once.
      # If it is already out, this run still builds + verifies the patch source,
      # but skips both publish steps.
      - name: Check if this patch revision is already published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="react-android-${REACT_VERSION}-e2e.${PATCH_REVISION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published (immutable). Build+verify only. Bump PATCH_REVISION to publish a new patch."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Patched AAR
        working-directory: android-patches
        run: ./gradlew assemblePatchedAAR -PpatchRevision=${{ env.PATCH_REVISION }} -PreactVersion=${{ env.REACT_VERSION }} --no-daemon --stacktrace

      - name: Publish to GitHub Packages (maven)
        if: steps.published.outputs.exists != 'true'
        working-directory: android-patches
        env:
          GITHUB_ACTOR: ${{ secrets.MAVEN_USERNAME || github.actor }}
          GITHUB_TOKEN: ${{ secrets.MAVEN_PASSWORD || secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -PpatchRevision=${{ env.PATCH_REVISION }} -PreactVersion=${{ env.REACT_VERSION }} --no-daemon --stacktrace

      - name: Verify patched AAR
        working-directory: android-patches
        run: |
          set -euo pipefail
          V="${REACT_VERSION}-e2e.${PATCH_REVISION}"
          GLOBS=(
            'com/facebook/react/views/view/WindowUtil*'
            'com/facebook/react/modules/statusbar/StatusBarModule*'
          )

          # Extract the classes we replaced, from both the patched AAR and the
          # pristine upstream one downloaded by the build.
          mkdir -p verify/new verify/orig
          ( cd verify/new  && unzip -o -q "../../build/patched/react-android-${V}.aar" classes.jar \
              && unzip -o -q classes.jar "${GLOBS[@]}" )
          ( cd verify/orig && unzip -o -q "../../build/orig/react-android-${REACT_VERSION}-release.aar" classes.jar \
              && unzip -o -q classes.jar "${GLOBS[@]}" )

          # (A) No deprecated API may be REFERENCED. The patch reaches these
          #     setters through reflection, so their names appear in the
          #     constant pool as plain strings -- a text grep would match those
          #     and fail a correct build. Only javap distinguishes a real
          #     method reference from a string literal.
          fail=0
          while IFS= read -r f; do
            if javap -p -c "$f" | grep -qE 'Window\.(set|get)StatusBarColor|Window\.setNavigationBarColor'; then
              echo "::error::$f still references a deprecated edge-to-edge API"
              javap -p -c "$f" | grep -E 'Window\.(set|get)StatusBarColor|Window\.setNavigationBarColor' | sort -u
              fail=1
            fi
          done < <(find verify/new -name '*.class')
          [ "$fail" = 0 ] && echo "OK: no deprecated edge-to-edge API references"

          # (B) Signature parity. These class files REPLACE the upstream ones
          #     inside the AAR, so any member that upstream exposed and the
          #     patch drops becomes a NoSuchMethodError at runtime, everywhere
          #     in react-android that calls it.
          members() {
            javap -p "$1" | grep -vE '^Compiled from|class |^\}|^\{' | sed 's/^  //' | sort
          }
          while IFS= read -r orig; do
            rel="${orig#verify/orig/}"
            new="verify/new/$rel"
            if [ ! -f "$new" ]; then
              echo "::error::$rel present upstream but missing from the patched AAR"
              fail=1
              continue
            fi
            missing=$(comm -23 <(members "$orig") <(members "$new"))
            if [ -n "$missing" ]; then
              echo "::error::$rel drops members that upstream exposes:"
              echo "$missing"
              fail=1
            fi
          done < <(find verify/orig -name '*.class')
          [ "$fail" = 0 ] && echo "OK: every upstream member retained"

          exit "$fail"

      - name: Publish asset checksums (paste into withRNEdgeToEdgeFix.js)
        working-directory: android-patches/build/patched
        run: |
          V="${REACT_VERSION}-e2e.${PATCH_REVISION}"
          echo "PATCHED_VERSION   = '${V}'"
          echo "PATCHED_AAR_SHA256 = '$(sha256sum "react-android-${V}.aar" | cut -d' ' -f1)'"
          echo "PATCHED_POM_SHA256 = '$(sha256sum "react-android-${V}.pom" | cut -d' ' -f1)'"

      - name: Publish GitHub Release (consumed by withRNEdgeToEdgeFix.js)
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${REACT_VERSION}-e2e.${PATCH_REVISION}"
          TAG="react-android-${V}"
          gh release create "$TAG" \
            "android-patches/build/patched/react-android-${V}.aar" \
            "android-patches/build/patched/react-android-${V}.pom" \
            --repo "$GITHUB_REPOSITORY" \
            --title "react-android ${V} (patched AAR)" \
            --notes "Patched react-android ${REACT_VERSION}: removes deprecated Android 15 edge-to-edge APIs. Downloaded by plugins/withRNEdgeToEdgeFix.js during expo prebuild." \
            --latest=false --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: react-android-patched
          path: |
            android-patches/build/patched/react-android-*.aar
            android-patches/build/patched/react-android-*.pom
