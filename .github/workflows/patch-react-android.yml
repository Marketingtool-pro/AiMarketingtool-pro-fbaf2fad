name: Patch react-android AAR

on:
  push:
    branches:
      - main
    paths:
      - android-patches/**
  workflow_dispatch:

jobs:
  build-patched-aar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          java-version: '21.0.5'
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x android-patches/gradlew

      - name: Build patched AAR
        working-directory: android-patches
        run: ./gradlew assemblePatchedAAR --no-daemon --stacktrace

      - name: Publish AAR to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AAR_VERSION="0.83.6-e2e.1"
          ORIG_VERSION="0.83.6"
          AAR_FILE="android-patches/build/patched/react-android-${AAR_VERSION}.aar"
          TAG="react-android-${AAR_VERSION}"

          # Download original POM from Maven Central and patch its version
          curl -sL "https://repo.maven.apache.org/maven2/com/facebook/react/react-android/${ORIG_VERSION}/react-android-${ORIG_VERSION}.pom" \
            | sed "s|<version>${ORIG_VERSION}</version>|<version>${AAR_VERSION}</version>|g" \
            > /tmp/react-android-${AAR_VERSION}.pom

          # Releases in this repo are immutable and tag creation is restricted,
          # so an existing release/tag cannot be deleted or recreated. Only
          # create the release when it does not already exist.
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists and is immutable — nothing to do."
          else
            gh release create "${TAG}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Patched react-android ${AAR_VERSION}" \
              --notes "Android 15 edge-to-edge deprecated API fix for react-android ${AAR_VERSION}" \
              "${AAR_FILE}" \
              "/tmp/react-android-${AAR_VERSION}.pom"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: react-android-patched
          path: android-patches/build/patched/react-android-0.83.6-e2e.1.aar
