name: Full Project Control

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which project scope to run
        required: true
        default: full
        type: choice
        options:
          - full
          - phone
          - web
      phone_ref:
        description: Branch or tag for the phone repo workflow run
        required: true
        default: Master
        type: string
      web_ref:
        description: Branch or tag for the web repo workflow run
        required: true
        default: main
        type: string
      run_phone_deploy:
        description: Also trigger phone production deploy
        required: true
        default: true
        type: boolean
      publish_control_package:
        description: Also publish this repo package workflow
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  phone-ci:
    if: ${{ inputs.target == 'full' || inputs.target == 'phone' }}
    environment: ORG_WORKFLOW_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Trigger and watch phone CI
        env:
          GH_TOKEN: ${{ secrets.ORG_WORKFLOW_TOKEN }}
          WORKFLOW: build-and-test.yml
          REPO: Marketingtool-pro/AiMarketingtool-pro-fbaf2fad
          REF: ${{ inputs.phone_ref }}
        run: bash .github/scripts/dispatch-and-watch.sh

  web-ci:
    if: ${{ inputs.target == 'full' || inputs.target == 'web' }}
    environment: ORG_WORKFLOW_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Trigger and watch web CI
        env:
          GH_TOKEN: ${{ secrets.ORG_WORKFLOW_TOKEN }}
          WORKFLOW: node.js.yml
          REPO: Marketingtool-pro/web-app-router-
          REF: ${{ inputs.web_ref }}
        run: bash .github/scripts/dispatch-and-watch.sh

  phone-deploy:
    if: ${{ (inputs.target == 'full' || inputs.target == 'phone') && inputs.run_phone_deploy }}
    needs: phone-ci
    environment: ORG_WORKFLOW_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Trigger and watch phone production deploy
        env:
          GH_TOKEN: ${{ secrets.ORG_WORKFLOW_TOKEN }}
          WORKFLOW: production-deploy.yml
          REPO: Marketingtool-pro/AiMarketingtool-pro-fbaf2fad
          REF: ${{ inputs.phone_ref }}
        run: bash .github/scripts/dispatch-and-watch.sh

  # NOTE: there is no `web-deploy` job. The web app (Cloud Run service
  # aimarketingtool-pro-fbaf2fad-git) deploys from a Google Cloud Build trigger
  # on push to Marketingtool-pro/web-app-router-, not from a GitHub Actions
  # workflow. The job that used to live here dispatched
  # `google-cloudrun-docker.yml`, which does not exist in that repo, so it could
  # only ever fail. Re-add it here if that workflow is created later.
