name: Publish Package

# Manual-only.
# npm-publish-github-packages.yml already publishes this same package on
# `release: [created]`, with a build + test gate in front of it. Having both
# fire on a release made two jobs race for the same version: one won, the other
# died with 409 "version already exists" and turned every release red.
# This workflow is kept as a hand-run fallback, not deleted.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.18.1'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@marketingtool-pro'
      - run: npm ci
      - run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
