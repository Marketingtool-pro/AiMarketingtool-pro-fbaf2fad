name: Deploy Firebase Functions

# Triggers on changes to functions/ or manual dispatch.
# Uses Workload Identity Federation (keyless) — no JSON key stored in secrets.
on:
  push:
    branches: [Master]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for WIF OIDC token exchange

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Build & Deploy Functions (Cloud Run / Firebase)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # Keyless auth via Workload Identity Federation.
      # Pool:    external-idps / providers: github (OIDC)
      # SA:      github-action-1140184974@marketing-tool-484720.iam.gserviceaccount.com
      # Required SA roles:
      #   - roles/cloudfunctions.admin
      #   - roles/run.admin
      #   - roles/iam.serviceAccountUser
      #   - roles/firebase.admin (or roles/firebasedevelop.admin)
      - name: Authenticate to Google Cloud (WIF keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: 'projects/911925145433/locations/global/workloadIdentityPools/external-idps/providers/github'
          service_account: 'github-action-1140184974@marketing-tool-484720.iam.gserviceaccount.com'
          token_format: 'access_token' # Forces OAuth token creation to bypass strict URL issuer checks

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest --no-audit --no-fund

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Build functions (TypeScript → JS)
        run: cd functions && npm run build

      - name: Deploy to Firebase Functions (us-central1 / Cloud Run)
        run: |
          firebase deploy --only functions \
            --project marketing-tool-484720 \
            --non-interactive
