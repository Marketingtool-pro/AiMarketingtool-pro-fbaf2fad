# Publish JS/TS modules from this repo to GitHub Packages (npm registry)

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.18.1
      - run: npm ci
      - run: npm test --if-present

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.18.1
          registry-url: https://npm.pkg.github.com/
          scope: '@marketingtool-pro'
      - run: npm ci
      # setup-node (registry-url above) already wrote an .npmrc that reads the
      # token from NODE_AUTH_TOKEN, so the token is never interpolated into the
      # script text or written to disk in plain form.
      # Trusted publishing (OIDC) exists only for registry.npmjs.org; GitHub
      # Packages accepts only GITHUB_TOKEN or a classic PAT, so zizmor's
      # use-trusted-publishing rule cannot be satisfied for this registry.
      - run: npm publish # zizmor: ignore[use-trusted-publishing]
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
