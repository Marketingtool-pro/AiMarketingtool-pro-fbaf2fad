# Deploy the Windmill scripts under windmill/ to wm.marketingtool.pro.
#
# Why this exists: the Windmill scripts are the actual tool backend, and until
# now they lived ONLY inside Windmill. Every deployment in the console shows
# Source "Manual" — there was no source control, no review, and no way to see
# what changed or roll back except Windmill's own version list.
#
# windmill/ in this repo is now the source of truth. This workflow pushes it.
#
# Follows the same rule as android-deploy-selfcontained.yml: no `uses:` lines,
# so the org Actions policy has nothing to reject.
name: Windmill Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would change without pushing"
        type: boolean
        default: true
  push:
    branches: [Master]
    paths:
      - 'windmill/**'

concurrency:
  group: windmill-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — token must be configured
        run: |
          if [ -z "${WINDMILL_TOKEN}" ]; then
            echo "::error::WINDMILL_TOKEN secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          WINDMILL_TOKEN: ${{ secrets.WINDMILL_TOKEN }}

      - name: Configure workspace
        run: |
          npx -y windmill-cli@latest workspace add mt marketingtool-pro \
            https://wm.marketingtool.pro --token "${WINDMILL_TOKEN}"
        env:
          WINDMILL_TOKEN: ${{ secrets.WINDMILL_TOKEN }}

      # Python syntax is checked before anything is pushed: a broken router
      # would take every tool on the web app down, and Windmill would happily
      # accept it.
      - name: Validate scripts
        run: |
          set -e
          found=0
          for f in $(find windmill -name '*.py'); do
            echo "checking $f"
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
            found=$((found+1))
          done
          echo "$found script(s) parsed cleanly"
          [ "$found" -gt 0 ] || { echo "::error::no scripts found under windmill/"; exit 1; }

      - name: Push to Windmill
        run: |
          cd windmill
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run — not pushing"
            find . -name '*.py' -print
            exit 0
          fi
          for f in $(find . -name '*.py' | sed 's|^\./||'); do
            echo "pushing $f"
            npx -y windmill-cli@latest script push "$f"
          done
        env:
          WINDMILL_TOKEN: ${{ secrets.WINDMILL_TOKEN }}
          # A push to Master deploys for real; a manual run defaults to dry run
          # so the first use of this workflow cannot surprise anyone.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
