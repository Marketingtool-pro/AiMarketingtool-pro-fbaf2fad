name: Merge All Branches into Master

on:
  workflow_dispatch:

jobs:
  merge-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

      - name: Merge all branches
        run: |
          git fetch --all
          for BRANCH in "ai-findings-autofix/plugins-withKotlinKspFix.js" "ai-findings-autofix/scripts-total_rich_overhaul.sh" "Lokeninfinitypoint-patch-1" "mobile-overhaul-2026-04-14" "add-claude-github-actions-1776199121290" "copilot/set-up-copilot-instructions" "claude/review-issues-merge-prs-xsNTw"; do
            echo "Merging $BRANCH..."
            git merge "origin/$BRANCH" -X ours --no-edit -m "Merge into Master" || git merge --abort
          done

      - name: Push
        run: git push origin Master
