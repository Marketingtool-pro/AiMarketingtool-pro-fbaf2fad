name: Merge All Branches into Master

on:
  workflow_dispatch:

  jobs:
    merge-branches:
        runs-on: ubuntu-latest
            permissions:
                  contents: write
                        pull-requests: write
                            steps:
                                  - name: Checkout Master
                                          uses: actions/checkout@v4
                                                  with:
                                                            ref: Master
                                                                      fetch-depth: 0
                                                                                token: ${{ secrets.GITHUB_TOKEN }}

                                                                                      - name: Configure Git
                                                                                              run: |
                                                                                                        git config user.email "action@github.com"
                                                                                                                  git config user.name "GitHub Actions"
                                                                                                                  
                                                                                                                        - name: Merge all branches with ours strategy
                                                                                                                                run: |
                                                                                                                                          git fetch --all
                                                                                                                                                    
                                                                                                                                                              # List of branches to merge (excluding Master and master)
                                                                                                                                                                        BRANCHES=(
                                                                                                                                                                                    "origin/ai-findings-autofix/plugins-withKotlinKspFix.js"
                                                                                                                                                                                                "origin/ai-findings-autofix/scripts-total_rich_overhaul.sh"
                                                                                                                                                                                                            "origin/Lokeninfinitypoint-patch-1"
                                                                                                                                                                                                                        "origin/mobile-overhaul-2026-04-14"
                                                                                                                                                                                                                                    "origin/add-claude-github-actions-1776199121290"
                                                                                                                                                                                                                                                "origin/copilot/set-up-copilot-instructions"
                                                                                                                                                                                                                                                            "origin/claude/review-issues-merge-prs-xsNTw"
                                                                                                                                                                                                                                                                      )
                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                          for BRANCH in "${BRANCHES[@]}"; do
                                                                                                                                                                                                                                                                                                      BRANCH_NAME="${BRANCH#origin/}"
                                                                                                                                                                                                                                                                                                                  echo "Merging $BRANCH_NAME into Master..."
                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                          # Try merge with ours strategy (keep Master's version for conflicts)
                                                                                                                                                                                                                                                                                                                                                      if git merge "$BRANCH" -X ours --no-edit -m "Merge $BRANCH_NAME into Master" 2>&1; then
                                                                                                                                                                                                                                                                                                                                                                    echo "Successfully merged $BRANCH_NAME"
                                                                                                                                                                                                                                                                                                                                                                                else
                                                                                                                                                                                                                                                                                                                                                                                              echo "Failed to merge $BRANCH_NAME, aborting and continuing..."
                                                                                                                                                                                                                                                                                                                                                                                                            git merge --abort 2>/dev/null || true
                                                                                                                                                                                                                                                                                                                                                                                                                        fi
                                                                                                                                                                                                                                                                                                                                                                                                                                  done
                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Push to Master
                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                          git push origin Master --force-with-lease || git push origin Master
