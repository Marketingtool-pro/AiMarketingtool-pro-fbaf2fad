name: Production Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        type: choice
        default: 'all'
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eas-build-production:
    name: Build & Auto-Submit (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: 18.13.1
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo / EAS auth (auto-connect)
        run: |
          eas whoami
          eas project:info

      - name: Write Google Play Service Account key (android)
        if: ${{ matrix.platform == 'android' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform) }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set; android submit will fail."
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./.eas-google-play-sa.json

      - name: Write App Store Connect API key (ios)
        if: ${{ matrix.platform == 'ios' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform) }}
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_ASC_API_KEY_P8" ]; then
            echo "::error::APPLE_ASC_API_KEY_P8 secret is not set; ios submit will fail."
            exit 1
          fi
          printf '%s' "$APPLE_ASC_API_KEY_P8" > ./AuthKey_D5KG7J5R95.p8

      - name: Build production with auto-submit (${{ matrix.platform }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        run: |
          # Retry against transient Expo / GH outages so a real failure
          # is the only thing that fails this production deploy.
          attempt=1
          max_attempts=3
          until eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --auto-submit \
            --non-interactive; do
            status=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::eas build (${{ matrix.platform }}) failed after ${attempt} attempts (exit ${status})"
              exit "$status"
            fi
            sleep_for=$((60 * attempt))
            echo "::warning::eas build attempt ${attempt} failed (exit ${status}); retrying in ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done
