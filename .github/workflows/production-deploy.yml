name: Production Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        type: choice
        default: 'all'
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eas-build-production:
    name: Build & Auto-Submit (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: 18.13.1
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo / EAS auth (auto-connect)
        run: |
          eas whoami
          eas project:info

      - name: Build production with auto-submit (${{ matrix.platform }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --auto-submit \
            --non-interactive \
            --no-wait

  eas-submit-fallback:
    name: EAS Submit Fallback (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: eas-build-production
    if: always() && needs.eas-build-production.result != 'cancelled'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: 18.13.1
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Submit latest finished build (${{ matrix.platform }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        continue-on-error: true
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile production \
            --non-interactive \
            --latest \
            --wait
