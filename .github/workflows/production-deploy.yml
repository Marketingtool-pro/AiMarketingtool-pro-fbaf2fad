name: Production Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        type: choice
        default: 'all'
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eas-build-production:
    name: Build & Submit (${{ matrix.platform }})
    runs-on: ubuntu-latest
    # Dependabot PRs run with a read-only token and no EXPO_TOKEN
    # access, so excluded at job level. The platform-input filter must
    # live at the step level because jobs.<id>.if is evaluated before
    # the strategy matrix expands and matrix.* is not yet defined.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install eas-cli directly (bypass expo-github-action probe)
        run: npm install -g eas-cli@18.13.1

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo / EAS auth (auto-connect)
        shell: bash
        env:
          EXPO_TOKEN_RAW: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN_RAW" | tr -d '\r\n\t ' )"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty (or only whitespace); the production build cannot authenticate to EAS."
            exit 1
          fi
          if [ "${#EXPO_TOKEN}" != "${#EXPO_TOKEN_RAW}" ]; then
            echo "::warning::EXPO_TOKEN secret contained whitespace/newlines and was trimmed (${#EXPO_TOKEN_RAW} → ${#EXPO_TOKEN} chars). Update the secret value to remove trailing whitespace."
          fi
          export EXPO_TOKEN
          surface() {
            local label="$1"; shift
            local log; log="$(mktemp)"
            if ! "$@" 2>&1 | tee "$log"; then
              local s="${PIPESTATUS[0]}"
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                echo "::error::${label}: ${line}"
              done < "$log"
              echo "::error::${label} failed (exit ${s})"
              return "$s"
            fi
          }
          surface "eas --version" eas --version
          surface "eas whoami" eas whoami
          surface "eas project:info" eas project:info

      - name: Write Google Play Service Account key (android)
        if: ${{ matrix.platform == 'android' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform) }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set; android submit will fail."
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./.eas-google-play-sa.json

      - name: Write App Store Connect API key (ios)
        if: ${{ matrix.platform == 'ios' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform) }}
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_ASC_API_KEY_P8" ]; then
            echo "::error::APPLE_ASC_API_KEY_P8 secret is not set; ios submit will fail."
            exit 1
          fi
          printf '%s' "$APPLE_ASC_API_KEY_P8" > ./AuthKey_D5KG7J5R95.p8

      - name: Build production (${{ matrix.platform }})
        id: build
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        shell: bash
        env:
          EXPO_TOKEN_RAW: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN_RAW" | tr -d '\r\n\t ' )"
          export EXPO_TOKEN

          # Indicators of *transient* failures we should retry. Anything
          # else (compile error, signing failure, config error, etc.) is
          # deterministic and we fail immediately to avoid burning EAS
          # build minutes on five identical failures.
          is_transient() {
            grep -qiE 'service unavailable|services aren'\''t available|cache service responded|enotfound|etimedout|econnreset|econnaborted|rate limit|getaddrinfo|socket hang up|502 bad gateway|503 service|504 gateway|network request failed|fetch failed' "$1"
          }

          attempt=1
          max_attempts=5
          sleeps="60 120 240 480"
          log="$(mktemp)"
          while :; do
            # Build only — no --auto-submit — so a retry never creates
            # a duplicate store submission. Submit step below uses the
            # build_id captured here.
            if eas build \
              --platform ${{ matrix.platform }} \
              --profile production \
              --non-interactive 2>&1 | tee "$log"; then
              break
            fi
            status="${PIPESTATUS[0]}"
            if [ "$attempt" -ge "$max_attempts" ] || ! is_transient "$log"; then
              echo "::group::Final eas build output (last 100 lines, ${{ matrix.platform }})"
              tail -n 100 "$log"
              echo "::endgroup::"
              if build_url=$(grep -oE 'https://expo\.dev/[^[:space:]]+/builds/[A-Za-z0-9-]+' "$log" | tail -n1); then
                [ -n "$build_url" ] && echo "::notice::Last EAS build URL (${{ matrix.platform }}): ${build_url}"
              fi
              grep -iE '^(error|✖|✗|fail|⚠)|: error |: failed |fatal|cannot find|enoent|eaccess|enotfound|401|403|500|service unavailable' "$log" \
                | tail -n 10 \
                | while IFS= read -r line; do
                    echo "::error::${line}"
                  done
              if ! is_transient "$log"; then
                echo "::error::eas build (${{ matrix.platform }}) failed (exit ${status}) with a deterministic error; not retrying"
              else
                echo "::error::eas build (${{ matrix.platform }}) failed after ${attempt} attempts (exit ${status})"
              fi
              exit "$status"
            fi
            sleep_for=$(echo "$sleeps" | cut -d' ' -f"$attempt")
            echo "::warning::eas build attempt ${attempt} hit a transient failure (exit ${status}); retrying in ${sleep_for}s"
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

          # Pin the submit step to *this* build's id to avoid a race
          # where another build of the same profile finishes first and
          # `eas submit --latest` targets the wrong artifact. If we
          # can't parse the id, fail the job — silently falling back
          # to --latest would reintroduce the race we're protecting
          # against.
          build_id=$(grep -oE 'https://expo\.dev/[^[:space:]]+/builds/[A-Za-z0-9-]+' "$log" | tail -n1 | awk -F/ '{print $NF}')
          if [ -z "$build_id" ]; then
            echo "::error::eas build succeeded but build_id could not be parsed from its output; refusing to submit with --latest to avoid race with concurrent builds. Inspect the captured log above and update the URL-extraction grep."
            exit 1
          fi
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Submit production build to store (${{ matrix.platform }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform }}
        shell: bash
        env:
          EXPO_TOKEN_RAW: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          # No retry: eas submit is not idempotent, retrying could
          # enqueue a duplicate store submission. A real submit failure
          # surfaces here and fails the deploy loudly.
          set -o pipefail
          EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN_RAW" | tr -d '\r\n\t ' )"
          export EXPO_TOKEN
          # BUILD_ID is guaranteed non-empty by the previous step
          # (it exits 1 if the id can't be parsed), so no fallback.
          if [ -z "$BUILD_ID" ]; then
            echo "::error::BUILD_ID output is empty; the build step should have failed earlier."
            exit 1
          fi
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile production \
            --non-interactive \
            --id "$BUILD_ID" \
            --wait
