name: Production Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  eas-build-production:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Re-enabled android for auto-submit
        platform: [ios, android]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build production
        env:
          PLATFORM: ${{ matrix.platform }}
        run: eas build --platform "$PLATFORM" --profile production --non-interactive

  eas-submit:
    name: Submit (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: eas-build-production
    strategy:
      fail-fast: false
      matrix:
        # Re-enabled android for auto-submit
        platform: [ios, android]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Submit to store
        env:
          PLATFORM: ${{ matrix.platform }}
        run: eas submit --platform "$PLATFORM" --profile production --non-interactive --latest
