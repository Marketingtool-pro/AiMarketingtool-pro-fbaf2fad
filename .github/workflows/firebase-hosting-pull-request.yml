name: Deploy to Firebase Hosting on PR
# Manual-only: builds + previews a web deploy (expo export --platform web) from the
# PHONE repo. The web app isn't published from here, and this failed on every PR
# (and fires on each of the many bot branches). Removed the pull_request trigger.
on: workflow_dispatch
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bun repo (no package-lock.json) — `npm ci` failed instantly. Use plain install.
      - run: npm ci --legacy-peer-deps --no-audit --no-fund && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARKETING_TOOL_484720 }}
          projectId: marketing-tool-484720
