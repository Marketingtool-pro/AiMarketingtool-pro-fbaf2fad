<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title | default: "MarketingTool" }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<style>
  /* Same palette as index.html so the markdown docs stop looking like a
     different site. Everything here is self-contained -- no external CSS,
     fonts or images -- to match the rest of the published pages. */
  :root{
    --bg:#0b0a14; --panel:#141227; --panel-2:#1a1830; --line:#2a2745;
    --text:#f2f1f7; --muted:#a09dba; --accent:#7c5cff; --accent-2:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-2)}
  a:hover{color:var(--accent)}

  .topbar{
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(700px 260px at 10% -40%, rgba(124,92,255,.22), transparent 60%);
  }
  .topbar .wrap{display:flex; align-items:center; gap:16px; padding:16px 24px}
  .topbar a{text-decoration:none; font-size:14px; color:var(--muted)}
  .topbar a:hover{color:var(--text)}
  .topbar .home{color:var(--text); font-weight:600}
  .topbar .sep{color:var(--line)}

  .wrap{max-width:860px; margin:0 auto; padding:0 24px}
  main{padding:44px 0 72px}

  h1,h2,h3,h4{line-height:1.25; letter-spacing:-.015em; margin:1.8em 0 .6em}
  h1{font-size:clamp(26px,4.4vw,38px); margin-top:0}
  h2{font-size:24px; padding-bottom:.35em; border-bottom:1px solid var(--line)}
  h3{font-size:19px}
  p{margin:0 0 1.1em}
  ul,ol{margin:0 0 1.1em; padding-left:1.4em}
  li{margin:.3em 0}
  strong{color:#fff}
  hr{border:0; border-top:1px solid var(--line); margin:2.2em 0}

  blockquote{
    margin:1.2em 0; padding:.6em 1.1em;
    border-left:3px solid var(--accent); background:var(--panel);
    border-radius:0 8px 8px 0; color:var(--muted);
  }
  blockquote p:last-child{margin-bottom:0}

  code{
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:rgba(124,92,255,.13); border:1px solid var(--line);
    padding:1px 6px; border-radius:5px; color:var(--accent-2);
  }
  pre{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; overflow-x:auto; margin:0 0 1.3em;
  }
  pre code{background:none; border:0; padding:0; color:var(--text); font-size:13px}

  table{border-collapse:collapse; width:100%; margin:0 0 1.4em; display:block; overflow-x:auto}
  th,td{border:1px solid var(--line); padding:9px 13px; text-align:left; font-size:14px}
  th{background:var(--panel-2); color:var(--text); font-weight:600}
  td{color:var(--muted)}
  tr:nth-child(even) td{background:rgba(255,255,255,.015)}

  img{max-width:100%}

  footer{border-top:1px solid var(--line); padding:26px 0 60px; color:var(--muted); font-size:14px}
  footer a{color:var(--muted)}
  footer .links{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:12px}

  @media (max-width:560px){
    main{padding:30px 0 48px}
    .topbar .wrap{padding:13px 18px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="home" href="{{ site.baseurl }}/">MarketingTool</a>
    <span class="sep">/</span>
    <a href="{{ site.baseurl }}/ARCHITECTURE.html">Architecture</a>
    <a href="{{ site.baseurl }}/MOBILE_TOOLS_POLICY.html">Mobile Tools Policy</a>
    <a href="{{ site.baseurl }}/tool-ui-blueprint.html">Tool UI Blueprint</a>
  </div>
</div>

<main class="wrap">
  {{ content }}
</main>

<footer>
  <div class="wrap">
    <div class="links">
      <a href="{{ site.baseurl }}/">Site index</a>
      <a href="https://github.com/Marketingtool-pro/AiMarketingtool-pro-fbaf2fad">Repository</a>
      <a href="https://marketingtool.pro">marketingtool.pro</a>
      <a href="https://app.marketingtool.pro">Web app</a>
    </div>
    <div>MIT licensed · Maintained by Marketingtool-pro</div>
  </div>
</footer>

</body>
</html>
