# libonig.dylib through an @rpath the install never populates, so the binary
# aborts at launch (dyld: Library not loaded ... libonig.dylib). With
# activate_aggressive = true it also shadowed the working jq from Homebrew and
# /usr/bin, so every `jq` call inside this repo crashed. Use the system or
# Homebrew jq instead; add jq back through a working backend if it is needed.
