[tools]
node = "24.18.0"
ruby = "3.3"
pi = "latest"
bun = "latest"
go = "1.25.8"
python = "3.12"
uv = "latest"
bazel = "latest"
azure = { version = "latest", uvx_args = "--prerelease=allow" }
npm = "latest"
aws-cli = { version = "latest", symlink_bins = true }
"aqua:aws/aws-cli" = "latest"
"pkgx:stedolan.github.io/jq" = "1.7.1"
"vfox-npm:prettier" = "latest"
pre-commit = "latest"
gemini-cli = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
ruff = "latest"
terraform = "latest"

[env]
_file = ".env"  # Automatically hooks and injects your local .env file variables

[tasks]
start = "npx expo start"
dev = "npm run dev"

[deps]
npm = { auto = true }
bun = { auto = true }
go = { auto = true }
uv = { auto = true }
bundler = { auto = true }

[settings]
# REMOVED disable_tools to let mise manage Node and Rust automatically
activate_aggressive = true
all_compile = false
always_keep_install = true
silent = true
terminal_progress = true
always_keep_download = true
exec_auto_install = true
global_config_root = ""

