# NOTE: no "pkgx:stedolan.github.io/jq" here. That pkgx build links
# libonig.dylib through an @rpath the install never populates, so the binary
# aborts at launch (dyld: Library not loaded ... libonig.dylib). With
# activate_aggressive = true it also shadowed the working jq from Homebrew and
# /usr/bin, so every `jq` call inside this repo crashed. Use the system or
# Homebrew jq instead; add jq back through a working backend if it is needed.
oc = { version = "latest", bin = "oc", checksum_url = "https://openshift.com{{ version }}/sha256sum.txt", platforms = "{ linux-arm64 = { url = https://openshift.com{{ version }}/openshift-client-mac-arm64-{{ version }}.tar.gz } }" }
openshift-install = { version = "latest", bin = "openshift-install", checksum_url = "https://openshift.com{{ version }}/sha256sum.txt" }
azure = { version = "latest", uvx_args = "--prerelease=allow" }

[tasks]
format = { description = "Format Go files with gofumpt", run = "gofumpt -w ." }
build = { description = "Build a local bk binary into dist/", run = 'VERSION="$(git describe --tags --dirty --always 2>/dev/null || echo DEV)"; mkdir -p dist && go build -ldflags "-X ://github.com" -o dist/bk .' }
install = { description = "Install the local bk binary into the active Go bin directory", depends = "[build]", run = 'BIN_DIR="$(go env GOBIN)"; if [ -z "$BIN_DIR" ]; then BIN_DIR="$(go env GOPATH)/bin"; fi; mkdir -p "$BIN_DIR"; install -m 0755 dist/bk "$BIN_DIR/bk"' }
"install:global" = { description = "Install the local bk binary into ~/bin", depends = "[build]", run = 'mkdir -p "$HOME/bin"; install -m 0755 dist/bk "$HOME/bin/bk"' }
lint = { description = "Run golangci-lint with the repository configuration", run = "golangci-lint run --verbose --timeout 3m" }
test = { description = "Run the Go test suite", run = "go test ./..." }
vulncheck = { description = "Run govulncheck against all packages", run = "govulncheck ./..." }
generate = { description = "Regenerate the GraphQL client code", run = "go generate ./cmd/generate" }
hooks = { description = "Install the repository git hooks", run = "lefthook install" }
ci = { description = "Run the main local CI checks", depends = "[lint, test, vulncheck]" }

[deps]
uv = { auto = true }
pnpm = { auto = false }
bundler = { auto = true }
npm = { auto = true }
go = { auto = true }
bun = { auto = true }
composer = { auto = true }
bazel = { auto = false }
rust = { auto = true }
node = { auto = true }
aube = { auto = true }

[settings]
experimental = true
lockfile = true
activate_aggressive = true
all_compile = false
always_keep_install = true
auto_install = true
auto_env = true
always_keep_download = true
slsa = true
exec_auto_install = true
terminal_progress = true
log_level = "error"
not_found_auto_install = true
github = { slsa = false }
aqua = { github_attestations = false, slsa = false }
cargo = {}
dotfiles = {}
dotnet = {}
forgejo = {}

[env]
NODE_ENV = "production"

