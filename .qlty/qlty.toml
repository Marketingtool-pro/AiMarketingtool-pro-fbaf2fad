# This file was automatically generated by `qlty init`.
# Modified to fix syntax errors and bypass the radarlint-java issue limit.

config_version = "0"

# Global exclusions for all activities (build artifacts, dependencies, etc.)
exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# Targeted layer to force the Java plugin to ignore raw compiled binaries
[[exclude]]
plugins = ["radarlint-java"]
file_patterns = [
  "**/out/**",
  "**/bin/**",
  "**/*.class",
  "**/*.jar"
]

# --- PLUGINS ---

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "clippy"

[[plugin]]
name = "eslint"
# eslint-config-expo pulls in eslint-plugin-react, which supports ESLint <= 9.
version = "9.39.5"
package_file = "package.json"
package_filters = ["eslint", "prettier", "jest"]
prefix = ""

[[plugin]]
name = "eslint"
version = "8.57.1"
package_file = "package.json"
package_filters = ["eslint", "prettier", "jest"]
prefix = "functions"

[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier", "jest"]
prefix = "marketingtool"

[[plugin]]
name = "gofmt"

[[plugin]]
name = "golangci-lint"
drivers = [
  "lint",
]
mode = "comment"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "ktlint"
drivers = [
  "lint",
]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-go"
mode = "monitor"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-kotlin"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "rubocop"
drivers = [
  "lint",
]
version = "1.91.0"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "radarlint-java"
mode = "disabled"
