develocity:
  instances:
    main:
      access-key: "YOUR_DEVELOCITY_ACCESS_KEY"

s3:
  instances:
    local-s3:
      access-key-id: "test"
      secret-access-key: "test"

basic:
  identities:
    admin: "{noop}admin"  # {noop} is Spring Security's "no-op" prefix meaning the password is stored in plain text — only suitable for local testing
