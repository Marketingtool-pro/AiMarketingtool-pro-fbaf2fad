name: Auto-Build and Release Engine

on:
  push:
    branches: [main, Master, develop]

permissions:
  contents: write    # Grants permission to automatically create a GitHub Release
  security-events: write

jobs:
  validate-and-package:
    runs-on: self-hosted
    steps:
      # 1. Pull down the fresh push edits
      - name: Checkout Codebase
        uses: actions/checkout@v4
      
      # 2. Setup Node environment for your linting steps
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      # 3. Setup Java runtime required by the Kotlin compiler engine
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # 4. Pull down the official Kotlin CLI tool wrapper
      - name: Bootstrap Kotlin Toolchain
        run: |
          curl -sSL https://kotlinlang.org | bash
          echo "$HOME/.kotlin/bin" >> $GITHUB_PATH
      
      # 5. Run your frontend quality scans
      - name: Process JavaScript and TypeScript Validation
        run: |
          npm ci
          npm run lint --if-present || echo "No lint script defined"
          npx tsc --noEmit
      
      # 6. Let the runner automatically build your Android file 
      - name: Compile Production Android Package
        run: |
          kotlin build --project-dir=.

      # 7. Auto-submit and upload the completed build artifact to GitHub Releases
      - name: Automatically Submit and Release Package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/outputs/**/*.apk
            build/outputs/**/*.aab
          tag_name: build-${{ github.run_number }}
          name: Automated Build v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in secret token, no setup needed
